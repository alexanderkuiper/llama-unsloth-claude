services:
  # --- llama.cpp backend (8082)---
  llama:
    profiles: ["llama"]
    container_name: llama_cpp
    build:
      context: .
      dockerfile: Dockerfile.llama
    env_file:
      - .env
    volumes:
      - ./models:/models
    ports:
      - "8082:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases: [llm]
    restart: unless-stopped

  # --- Ollama backend (8082)---
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./models:/models
      - ./entrypoint.ollama.sh:/entrypoint.sh
      - ollama-data:/root/.ollama
    entrypoint: ["sh", "/entrypoint.sh"]
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases: [llm]
    restart: unless-stopped

  # --- OpenWebUI (8080)---
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    ports:
      - "8080:8080"
    environment:
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://llm:8080/v1 
      - OLLAMA_BASE_URL=http://llm:11434
    volumes:
      - ./openwebui-data:/app/backend/data
    restart: unless-stopped

  # --- Unsloth (ONLY with llama.cpp) (8081)---
  unsloth:
    profiles: ["llama"]
    image: unsloth/unsloth:latest
    container_name: unsloth
    command: ["unsloth", "studio", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8081:8000"
    environment:
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://llm:8080
      - OPENAI_API_KEY=dummy
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./src:/workspace/code
      - ./unsloth-config:/root/.unsloth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # --- Claude agent (Tavily here) ---
  claude:
    profiles: ["claude"]
    container_name: claude
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-slim
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        RUN npm install -g @anthropic-ai/claude-code
        WORKDIR /project
        ENTRYPOINT ["tail", "-f", "/dev/null"]
    volumes:
      - ./src:/project
    environment:
      - ANTHROPIC_BASE_URL=http://llm:8080
      - ANTHROPIC_API_KEY=dummy
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    stdin_open: true
    tty: true

  pi:
    profiles: ["pi"]
    container_name: pi
    ports: 
      - "5173:5173"
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates git ripgrep curl \
            && rm -rf /var/lib/apt/lists/*
        RUN npm install -g --ignore-scripts @earendil-works/pi-coding-agent
        RUN curl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh | bash -s pi
        WORKDIR /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - pi-agent-home:/root/.pi/agent
      - ./entrypoint.pi.sh:/entrypoint.sh:ro
    entrypoint: ["sh", "/entrypoint.sh"]
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  ollama-data:
  pi-agent-home:
