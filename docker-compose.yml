services:
  # --- llama.cpp backend (8082)---
  llama:
    profiles: ["llama"]
    container_name: llama_cpp
    build:
      context: .
      dockerfile: Dockerfile.llama
    env_file:
      - .env
    volumes:
      - ./models:/models
    ports:
      - "8082:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases: [llm]
    restart: unless-stopped

  # --- Ollama backend (8082)---
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ./models:/models
      - ./entrypoint.ollama.sh:/entrypoint.sh
      - ollama-data:/root/.ollama
    entrypoint: ["sh", "/entrypoint.sh"]
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      default:
        aliases: [llm]
    restart: unless-stopped

  # --- Docling Serve (5001) — layout-aware PDF/document extraction ---
  docling:
    profiles: ["docling"]
    image: quay.io/docling-project/docling-serve-cu128:latest
    container_name: docling
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=true      # lets you test at http://localhost:5001/ui
      - DOCLING_SERVE_MAX_SYNC_WAIT=600
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # --- SearXNG meta-search (8900, host: 127.0.0.1 / containers: http://searxng:8080) ---
  # Agentic/JSON-optimized: formats=json enabled, limiter+botdetection off, free engines only.
  # Example: curl 'http://127.0.0.1:8900/search?q=pi+coding+agent&format=json'
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8900:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # --- OpenWebUI (8080)---
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    # always pull the newest :main image on `docker compose up` (no manual `pull` needed)
    pull_policy: always
    container_name: openwebui
    ports:
      - "8080:8080"
    environment:
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://llm:8080/v1 
      - OLLAMA_BASE_URL=http://llm:11434
      # --- Content extraction engine ---
      - CONTENT_EXTRACTION_ENGINE=docling
      - ENABLE_DOCLING=true
      - DOCLING_SERVER_URL=http://docling:5001
    volumes:
      - openwebui-data:/app/backend/data
    restart: unless-stopped

  # --- Unsloth (ONLY with llama.cpp) (8081)---
  unsloth:
    profiles: ["llama"]
    image: unsloth/unsloth:latest
    container_name: unsloth
    command: ["unsloth", "studio", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8081:8000"
    environment:
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://llm:8080
      - OPENAI_API_KEY=dummy
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=tavily
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./src:/workspace/code
      - ./unsloth-config:/root/.unsloth
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # --- Claude agent (Tavily here) ---
  claude:
    profiles: ["claude"]
    container_name: claude
    build:
      context: .
      dockerfile_inline: |
        FROM node:20-slim
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
        RUN npm install -g @anthropic-ai/claude-code
        WORKDIR /project
        ENTRYPOINT ["tail", "-f", "/dev/null"]
    volumes:
      - ./src:/project
    environment:
      - ANTHROPIC_BASE_URL=http://llm:8080
      - ANTHROPIC_API_KEY=dummy
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    stdin_open: true
    tty: true

  pi:
    profiles: ["pi"]
    container_name: pi
    ports:
      - "127.0.0.1:5173:5173"
      - "8888:8888"
    build:
      context: .
      dockerfile_inline: |
        FROM node:24-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends bash ca-certificates git ripgrep curl \
            && rm -rf /var/lib/apt/lists/*
        RUN npm install -g --ignore-scripts @earendil-works/pi-coding-agent
        RUN curl -fsSL https://raw.githubusercontent.com/Egonex-AI/Understand-Anything/main/install.sh | bash -s pi
        WORKDIR /workspace
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - pi-agent-home:/root/.pi/agent
      - understand-anything-data:/root/.understand-anything
      - ./shared/skills:/skills:ro   # central skills store, linked into /root/.agents/skills at startup
      - ./entrypoint.pi.sh:/entrypoint.sh:ro
    entrypoint:
      - sh
      - -c
      - |
        find /root/.understand-anything /root/.agents -iname "SKILL.md" -path "*understand-dashboard*" 2>/dev/null | while read -r f; do
          sed -i 's/--host 127\.0\.0\.1/--host 0.0.0.0/g' "$$f"
        done
        # Link centrally stored skills (./shared/skills) into pi's skills dir
        if [ -d /skills ]; then
          mkdir -p /root/.agents/skills
          for d in /skills/*/; do
            [ -d "$$d" ] || continue
            n=$$(basename "$$d")
            [ -e "/root/.agents/skills/$$n" ] || ln -s "$$d" "/root/.agents/skills/$$n"
          done
        fi
        exec sh /entrypoint.sh
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  searxng-data:
  ollama-data:
  pi-agent-home:
  understand-anything-data:
  openwebui-data: